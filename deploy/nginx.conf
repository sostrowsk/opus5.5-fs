# C172 Web – nginx-Server-Block für Debian 13 (trixie), nginx aus den Debian-Paketquellen.
# Ziel: /etc/nginx/sites-available/c172 (Symlink nach sites-enabled/, das Ansible-Playbook erledigt das).
#
# Auslieferung (SPEC §6a):
#   - Webroot ist der Symlink /var/www/c172/current → releases/<release-id>/ (nur index.html, css/, js/, vendor/)
#   - HTML, JS, CSS immer revalidieren (no-cache + ETag/Last-Modified) – die Dateinamen sind nicht inhaltsadressiert
#   - immutable nur für vendor/three/ (an die gepinnte three-Version 0.186.0 gebunden; bei einem Upgrade den Pfad
#     versionieren, z. B. vendor/three-0.187.0/, sonst halten Browser die alte Datei bis zu einem Jahr)
#   - .js/.mjs als text/javascript, gzip für Text, fehlende Dateien → 404 (kein SPA-Fallback)
#   - nginx (www-data) liest nur: Dateien gehören root, 0644/0755
#
# HTTPS – zwei dokumentierte Varianten (Domain/Infrastruktur stehen noch nicht fest):
#   A) Hinter einem vorhandenen Reverse-Proxy (TLS dort): diesen Block unverändert auf Port 80 lassen und
#      unten „set_real_ip_from“ auf die Proxy-Adresse setzen.
#   B) nginx terminiert TLS selbst mit certbot (apt install certbot):
#      empfohlen: certbot certonly --webroot -w /var/www/letsencrypt -d example.org und den auskommentierten
#      443-Block am Ende hier im Repo aktivieren – dann bleibt TLS Teil der ausgerollten Konfiguration.
#      Wer stattdessen „certbot --nginx“ nutzt (ändert diese Datei auf dem Server), muss danach mit
#      -e nginx_site_managed=false ausrollen, sonst überschreibt das Playbook die TLS-Ergänzungen.

# Cache-Regel je Pfad (Datei wird im http-Kontext eingebunden, deshalb ist map hier erlaubt)
map $uri $c172_cache_control {
    ~^/vendor/three/  "public, max-age=31536000, immutable";
    default           "no-cache";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/c172/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Variante A: Client-IP vom Reverse-Proxy übernehmen (Adresse anpassen)
    # set_real_ip_from 10.0.0.0/8;
    # real_ip_header X-Forwarded-For;

    # ---------------------------------------------------------------- Kompression (nur Text; Bilder gibt es nicht)
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain;
    # text/html komprimiert nginx mit „gzip on“ immer

    # ---------------------------------------------------------------- Header (in den locations wird kein add_header
    # gesetzt, damit diese Zeilen überall geerbt werden)
    add_header Cache-Control $c172_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ACME-Challenges für certbot (Variante B, „certonly --webroot -w /var/www/letsencrypt“) – außerhalb der Releases
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    # Versteckte Dateien (.git, .claude, …) nie ausliefern – sie gehören ohnehin nicht ins Release
    location ~ /\. {
        return 404;
    }

    # three.js (gepinnt): ES-Module als text/javascript, LICENSE als Text
    location ^~ /vendor/three/ {
        types { }
        default_type text/javascript;
        try_files $uri =404;
        location ~ /LICENSE$ {
            default_type text/plain;
            try_files $uri =404;
        }
    }

    # ES-Module: korrekter MIME-Typ (Debians mime.types kennt .mjs nicht und nennt .js application/javascript)
    location ~* \.m?js$ {
        types { }
        default_type text/javascript;
        try_files $uri =404;
    }

    # alles andere: nur existierende Dateien, sonst 404 (kein SPA-Fallback)
    location / {
        try_files $uri $uri/index.html =404;
    }

    access_log /var/log/nginx/c172.access.log;
    error_log /var/log/nginx/c172.error.log warn;
}

# Variante B ohne certbot-Automatik (Pfade anpassen, dann den Port-80-Block oben auf eine Weiterleitung reduzieren:
#   return 301 https://$host$request_uri;):
#
# server {
#     listen 443 ssl;
#     listen [::]:443 ssl;
#     http2 on;
#     server_name example.org;
#     ssl_certificate     /etc/letsencrypt/live/example.org/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/example.org/privkey.pem;
#     add_header Strict-Transport-Security "max-age=31536000" always;
#     # … dieselben root/location-Blöcke wie oben …
# }
